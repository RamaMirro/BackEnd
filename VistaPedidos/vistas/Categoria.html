<!DOCTYPE html>
<html lang="es">
<head>
    <!-- SECCIÓN: Metadatos y Configuración del Navegador -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Categorías</title>

    <!-- SECCIÓN: Estilos Externos (Bootstrap y Personalizados) -->
    <!-- Importación de la librería Bootstrap 5 vía CDN para todo el diseño responsivo -->
    <link href="/VistaPedidos/libreria/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Vinculación con tu hoja de estilos personalizada para retoques visuales -->
    <link rel="stylesheet" href="/VistaPedidos/estilos/Style.css">
</head>
<body class="bg-light"> <!-- bg-light aplica un fondo gris muy tenue para mejorar el contraste -->

    <!-- SECCIÓN: Barra de Navegación Global -->
    <!-- Contiene los enlaces principales para alternar de forma cómoda entre las distintas pantallas del sistema -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema Pedidos</a>
            <div class="navbar-nav">
                <!-- Enlace activo (active) resaltado para indicar la sección actual -->
                <a class="nav-link active" href="categorias.html">Categorías</a>
                <a class="nav-link" href="productos.html">Productos</a>
                <a class="nav-link" href="pedidos.html">Nuevo Pedido</a>
            </div>
        </div>
    </nav>

    <!-- SECCIÓN: Contenedor Principal de la Interfaz -->
    <div class="container">
        <div class="row">
            
            <!-- SUBSECCIÓN: Formulario de Alta (Panel Izquierdo) -->
            <!-- Espacio dedicado para el ingreso y envío de nuevas categorías a la base de datos -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Nueva Categoría</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="nombreCategoria" class="form-label">Nombre de Categoría</label>
                            <!-- El id "nombreCategoria" es interceptado por AgregarCategoria() en JS -->
                            <input type="text" class="form-control" id="nombreCategoria" placeholder="Ej: Electrónica">
                        </div>
                        <!-- Dispara el fetch POST al hacer clic -->
                        <button onclick="AgregarCategoria()" class="btn btn-success w-100">Guardar Categoría</button>
                    </div>
                </div>
            </div>

            <!-- SUBSECCIÓN: Grilla/Tabla de Contenidos (Panel Derecho) -->
            <!-- Tabla estructurada donde JavaScript inyectará las filas de categorías que traiga de la API -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0">Listado de Categorías</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nombre</th>
                                        <th style="width: 100px;">Eliminar</th>
                                        <th style="width: 100px;">Editar</th>
                                    </tr>
                                </thead>
                                <!-- El id "TablaCategorias" es clave para que JavaScript limpie e inyecte las filas (<tr>) -->
                                <tbody id="TablaCategorias">
                                    <!-- Contenido dinámico inyectado por JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- SECCIÓN: Ventana Modal Interactiva para Edición -->
    <!-- Cuadro de diálogo oculto por defecto. Se activa mediante JavaScript con bootstrap.Modal.show() -->
    <div class="modal fade" id="editarCategoriaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">Editar Categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Campo oculto indispensable para guardar transitoriamente el ID que se está editando -->
                    <input type="hidden" id="idEditar" value="0">
                    <div class="mb-3">
                        <label for="nombreEditar" class="form-label">Nombre Actualizado</label>
                        <!-- Cuadro de texto donde se carga el nombre actual para ser modificado -->
                        <input type="text" class="form-control" id="nombreEditar">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <!-- Ejecuta la función fetch PUT en JS para guardar los cambios -->
                    <button type="button" onclick="EditarCategoria()" class="btn btn-primary">Aplicar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN: Inyección de Scripts (Lógica y Funcionalidad) -->
    <!-- Compilado de librerías JS de Bootstrap para dar soporte de animación al modal -->
    <script src="/VistaPedidos/libreria/bootstrap/js/bootstrap.min.js"></script>
    <!-- Tu archivo de script corregido para procesar toda la lógica asíncrona de categorías -->
    <script src="/VistaPedidos/js/Categoria.js"></script>
</body>
</html>
